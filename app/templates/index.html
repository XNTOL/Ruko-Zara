{% extends "base.html" %}

{% block content %}
  <p>{{ t.tagline }}</p>

  {% if error %}
  <p id="form-error" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" action="/check">
    <input type="hidden" name="lang" value="{{ lang }}">
    <label for="message">{{ t.input_label }}</label>
    <textarea id="message" name="message" rows="8" maxlength="2000"{% if error %} autofocus{% endif %}>{{ message }}</textarea>
    <p>{{ t.privacy_hint }}</p>
    <button type="submit">{{ t.btn_check }}</button>
  </form>

  <p>
    <a href="/?lang={{ lang }}&amp;example={{ next_example }}">{{ t.btn_example }}</a>
  </p>
{% endblock %}
