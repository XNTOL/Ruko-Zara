# Render Blueprint — one Docker web service. Set AI secrets in the Dashboard.
services:
  - type: web
    name: ruko-zara
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      # Flip AI_ENABLED to true in the Dashboard after setting AI_API_KEY.
      - key: AI_ENABLED
        value: "false"
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      - key: AI_TIMEOUT_S
        value: "4"
      - key: MAX_CHARS
        value: "2000"
      - key: RATE_LIMIT_PER_MIN
        value: "12"
      - key: DAILY_AI_CAP
        value: "500"
